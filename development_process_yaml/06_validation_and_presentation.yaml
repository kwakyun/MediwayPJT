stage: "검증과 결과 패키지 구성"
goal: "기능과 계산 결과를 검증하고 앱 실행에 필요한 산출물을 하나의 패키지로 구성한다."

validation_tasks:
  - id: "TEST-01"
    task: "병원·약국, 날씨, 대기질, 인구 CSV가 정상적으로 로딩되는지 확인한다."
    pass_condition: "필수 컬럼과 데이터 타입이 유효하고 로딩 오류가 없다."
  - id: "TEST-02"
    task: "사용자 유형과 시설 유형 선택이 검색 및 추천 결과에 반영되는지 확인한다."
    pass_condition: "선택하지 않은 시설 유형이 결과에 포함되지 않고 사용자 규칙이 점수에 적용된다."
  - id: "TEST-03"
    task: "시설 표본의 거리를 외부 지도 또는 별도 계산 결과와 비교한다."
    pass_condition: "허용 오차 안에서 거리 값이 일치한다."
  - id: "TEST-04"
    task: "시설 3개 이상의 구성 점수와 최종 점수를 수작업으로 검산한다."
    pass_condition: "앱 결과가 정의된 산식과 반올림 규칙에 일치한다."
  - id: "TEST-05"
    task: "추천 카드와 지도 마커의 TOP 5 순위를 비교한다."
    pass_condition: "시설, 점수, 순위가 모두 일치한다."
  - id: "TEST-06"
    task: "추천 이유와 실제 적용된 점수 조건을 비교한다."
    pass_condition: "표시된 모든 이유가 실제 데이터와 규칙으로 설명된다."
  - id: "TEST-07"
    task: "지역 차트의 시설 합계와 인구 대비 지표를 원본 집계와 비교한다."
    pass_condition: "차트 값과 별도 집계 값이 일치한다."
  - id: "TEST-08"
    task: "데이터 출처, 데이터 기준, 서비스 한계가 필요한 화면에 표시되는지 확인한다."
    pass_condition: "사용자가 결과의 근거와 제한 사항을 확인할 수 있다."
  - id: "TEST-09"
    task: "검색 결과 없음, 데이터 오류, 진료과목 누락 상태를 강제로 발생시켜 확인한다."
    pass_condition: "앱이 중단되지 않고 적절한 안내와 대체 동작을 제공한다."
  - id: "TEST-10"
    task: "외부 연결을 차단한 상태에서 저장된 데이터로 전체 흐름을 실행한다."
    pass_condition: "검색, 추천, 지도, 차트가 모두 작동한다."

scenario_tests:
  - scenario: "일반 사용자"
    input: "일반 사용자 + 강수 없음 + 대기질 보통"
    pass_condition: "가까운 시설이 대체로 높은 순위에 표시된다."
  - scenario: "이동 부담이 큰 고령자"
    input: "고령자 + 비"
    pass_condition: "가까운 시설의 추천 이유에 짧은 이동거리가 반영된다."
  - scenario: "대기질에 민감한 호흡기 질환자"
    input: "호흡기 질환자 + 미세먼지 나쁨"
    pass_condition: "관련 진료과목과 짧은 이동거리가 점수와 추천 이유에 반영된다."

result_package_tasks:
  - id: "PACK-01"
    task: "프로젝트 문제, 데이터, 추천 방식, 결과, 한계를 설명하는 자료를 완성한다."
    output: "발표 슬라이드와 설명문"
  - id: "PACK-02"
    task: "대표 시나리오별 입력값, 기대 결과, 설명 포인트를 정리한다."
    output: "시연 입력값 3세트"
  - id: "PACK-03"
    task: "외부 연결 없이 앱을 실행할 수 있도록 정제 데이터를 포함한다."
    output: "processed CSV와 실행 안내"
  - id: "PACK-04"
    task: "앱 실행 장애에 대비해 핵심 흐름을 보여주는 시연 영상을 만든다."
    output: "대체 시연 영상"
  - id: "PACK-05"
    task: "점수 근거, 거리 방식, 신뢰 범위, 미포함 데이터에 관한 답변을 정리한다."
    output: "예상 질문과 답변"
  - id: "PACK-06"
    task: "앱, 데이터, 설명 자료, 시연 영상을 동일한 버전으로 묶고 복사본을 만든다."
    output: "실행 가능한 결과 패키지와 백업본"

final_acceptance_criteria:
  - "대표 시나리오 3종과 예외 상태가 오류 없이 처리된다."
  - "점수, 추천 이유, 지도, 차트의 값이 검증 결과와 일치한다."
  - "외부 연결 없이 저장된 데이터로 전체 기능을 실행할 수 있다."
  - "프로젝트의 차별점, 점수 방식, 데이터 근거, 구현 한계를 설명할 수 있다."
  - "앱 실행이 실패해도 대체 시연 자료로 핵심 기능을 전달할 수 있다."
