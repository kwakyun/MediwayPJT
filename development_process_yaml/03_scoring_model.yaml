stage: "추천 모델 구현"
goal: "입력 조건을 설명 가능한 점수와 추천 이유로 변환하고 TOP 5를 산출한다."

score_range: "0~100"
formula:
  distance_score: 0.45
  weather_score: 0.20
  air_quality_score: 0.20
  user_fit_score: 0.15
  expression: "거리점수×0.45 + 날씨점수×0.20 + 대기질점수×0.20 + 사용자적합도×0.15"

component_rules:
  distance_score:
    description: "사용자 기준 위치와 시설 사이의 직선거리"
    values:
      "1km 이하": 100
      "1km 초과 3km 이하": 75
      "3km 초과 5km 이하": 50
      "5km 초과": 25
  weather_score:
    description: "이동하기 좋은 정도"
    values:
      "비 없음·적정 기온": 100
      "약한 비 또는 덥거나 추움": 70
      "강한 비 또는 폭염·한파": 40
  air_quality_score:
    description: "실외 이동 부담이 낮은 정도"
    values:
      "좋음": 100
      "보통": 80
      "나쁨": 50
      "매우 나쁨": 30
  user_fit_score:
    general: "모든 시설에 기본 70점"
    elderly: "2km 이하 시설 100점, 그 외 60점"
    respiratory: "내과·이비인후과·호흡기 관련 진료과목 100점, 그 외 60점"

recommendation_reasons:
  rules:
    - condition: "distance_km <= 1"
      message: "현재 위치에서 가까워 이동 부담이 적습니다."
    - condition: "user_type == '고령자' and distance_km <= 2"
      message: "이동 거리가 짧아 고령자에게 비교적 적합합니다."
    - condition: "user_type == '호흡기 질환자' and specialty_match"
      message: "호흡기 관련 진료과목을 확인할 수 있습니다."
    - condition: "air_grade in ['나쁨', '매우 나쁨'] and distance_km <= 1"
      message: "대기질이 좋지 않아 실외 이동이 짧은 시설을 우선했습니다."
    - condition: "rainfall > 0 and distance_km <= 1"
      message: "비가 오는 상황을 고려해 가까운 시설을 우선했습니다."

tasks:
  - id: "SCORE-01"
    task: "Haversine 공식으로 사용자 위치와 시설 사이의 거리를 계산한다."
  - id: "SCORE-02"
    task: "거리, 날씨, 대기질, 사용자 적합도를 규칙에 따라 0~100점으로 변환한다."
  - id: "SCORE-03"
    task: "가중합으로 최종 점수를 계산하고 소수점 첫째 자리로 반올림한다."
  - id: "SCORE-04"
    task: "최종 점수를 내림차순으로 정렬해 TOP 5를 선택한다."
  - id: "SCORE-05"
    task: "적용된 조건 중 중요한 항목을 골라 추천 이유 2~3개를 생성한다."
  - id: "SCORE-06"
    task: "점수 구성 요소와 적용된 추천 이유를 결과 데이터에 함께 저장한다."

validation_scenarios:
  - name: "일반 사용자"
    expected: "가까운 시설이 높은 순위를 받는다."
  - name: "비 오는 날 고령자"
    expected: "2km 이하 시설이 평소보다 유리해진다."
  - name: "미세먼지 나쁨의 호흡기 질환자"
    expected: "가깝고 관련 진료과목이 있는 병원이 높은 순위를 받는다."

done_when:
  - "모든 최종 점수가 0~100 범위다."
  - "같은 입력은 같은 추천 결과를 만든다."
  - "TOP 5마다 추천 이유가 최소 2개 표시된다."
  - "세 대표 시나리오가 기대한 방향으로 순위 변화를 보여준다."
