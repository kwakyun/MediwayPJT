project:
  title: "날씨와 대기질을 고려한 생활 의료 접근성 추천 서비스"
  short_name: "메디웨이"
  target_result: "Streamlit 기반 의료기관 추천 프로토타입"

objective:
  core_message: "가장 가까운 병원이 아니라, 현재 조건에서 가장 가기 좋은 의료기관을 추천한다."
  tasks:
    - "거리뿐 아니라 날씨, 대기질, 사용자 특성을 반영한 접근성 문제를 정의한다."
    - "병원·약국의 방문 적합도를 설명 가능한 점수로 계산한다."
    - "추천 결과와 근거를 지도, 카드, 차트로 시각화한다."

scope:
  target_area: "1개 시·군·구"
  user_types: ["일반", "고령자", "호흡기 질환자"]
  facility_types: ["병원", "약국"]
  data: ["병원·약국 위치", "날씨", "대기질", "인구통계"]
  implementation: ["Python", "Streamlit", "pandas", "folium 또는 pydeck", "Plotly"]

required_tasks:
  - id: "CORE-01"
    task: "지역, 사용자 유형, 시설 유형, 기준 위치를 입력하는 검색 화면을 구현한다."
  - id: "CORE-02"
    task: "날씨와 대기질 정보를 추천 조건으로 불러온다."
  - id: "CORE-03"
    task: "병원·약국별 접근성 점수와 추천 이유를 계산한다."
  - id: "CORE-04"
    task: "추천 TOP 5를 카드와 지도에 동일한 순위로 표시한다."
  - id: "CORE-05"
    task: "지역 의료 현황 차트 2~3개를 만든다."
  - id: "CORE-06"
    task: "데이터 출처, 데이터 기준, 서비스 한계를 화면에 표시한다."
  - id: "CORE-07"
    task: "외부 연결 없이 실행할 수 있는 샘플 데이터를 준비한다."

deliverables:
  - "실행 가능한 Streamlit 앱"
  - "정제된 데이터 파일"
  - "추천 점수 계산 로직"
  - "대표 시나리오 3종"
  - "지역 의료 현황 시각화"
  - "발표 자료와 장애 대응용 시연 영상"

acceptance_criteria:
  - "대표 시나리오 3종이 처음부터 끝까지 오류 없이 실행된다."
  - "모든 추천 결과에 0~100점의 점수와 이해 가능한 이유가 표시된다."
  - "추천 카드와 지도 마커의 순위가 일치한다."
  - "저장된 데이터만으로 전체 기능을 시연할 수 있다."
  - "점수 산식, 데이터 출처, 구현 범위와 한계를 설명할 수 있다."

task_files:
  - "01_two_week_plan.yaml"
  - "02_data_preparation.yaml"
  - "03_scoring_model.yaml"
  - "04_streamlit_demo.yaml"
  - "05_analysis_and_story.yaml"
  - "06_validation_and_presentation.yaml"
  - "07_service_experience_design.yaml"
