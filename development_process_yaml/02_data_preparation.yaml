stage: "데이터 준비"
goal: "추천과 시각화에 필요한 데이터를 수집, 정제, 검증하고 앱 입력 형식으로 저장한다."

datasets:
  facilities:
    content: "병원·약국 위치와 기본 정보"
    source: "건강보험심사평가원 또는 공공데이터포털"
    columns: ["facility_id", "name", "type", "address", "latitude", "longitude", "specialty", "phone"]
  weather:
    content: "기온과 강수 상태"
    source: "기상청"
    columns: ["temperature", "rainfall", "weather_status"]
  air_quality:
    content: "미세먼지와 초미세먼지"
    source: "AirKorea"
    columns: ["pm10", "pm25", "air_grade"]
  population:
    content: "지역 인구와 고령 인구"
    source: "KOSIS"
    columns: ["region", "population", "elderly_population"]

tasks:
  - id: "DATA-01"
    task: "대상 지역 데이터만 추출한다."
  - id: "DATA-02"
    task: "컬럼명을 영문 소문자로 통일하고 숫자·문자 타입을 정리한다."
  - id: "DATA-03"
    task: "좌표가 없거나 대상 지역 밖인 시설을 확인한다."
  - id: "DATA-04"
    task: "중복 시설을 제거하고 병원·약국 구분을 통일한다."
  - id: "DATA-05"
    task: "앱에서 바로 읽을 수 있는 processed CSV를 만든다."
  - id: "DATA-06"
    task: "외부 연결 없이 사용할 날씨·대기질 샘플 CSV를 함께 저장한다."

output_files:
  - "data/processed/facilities.csv"
  - "data/processed/weather.csv"
  - "data/processed/air_quality.csv"
  - "data/processed/population.csv"
  - "data/source_notes.md"

quality_check:
  - "시설명·유형·주소·위도·경도에 빈 값이 없는가?"
  - "위도와 경도가 지도에서 대상 지역에 표시되는가?"
  - "같은 시설이 중복되지 않았는가?"
  - "날씨·대기질 값의 단위와 등급 기준이 기록되어 있는가?"
  - "인구 데이터의 집계 기준이 화면 설명과 일치하는가?"

done_when:
  - "Streamlit에서 네 CSV를 오류 없이 읽는다."
  - "지도에 병원과 약국이 올바른 위치로 표시된다."
  - "데이터 출처, 활용 컬럼, 정제 규칙을 설명할 수 있다."
