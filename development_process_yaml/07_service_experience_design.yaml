stage: "서비스 경험 설계"
goal: "사용자가 검색 조건을 이해하고 추천 결과와 근거를 자연스럽게 확인할 수 있도록 서비스의 구성, 디자인, 기능, 상호작용을 구체화한다."

experience_principles:
  - id: "UX-PRINCIPLE-01"
    principle: "입력보다 결과를 중심으로 표현한다."
    application: "검색 조건은 간결하게 유지하고 추천 TOP 5와 추천 이유를 화면의 핵심 영역에 배치한다."
  - id: "UX-PRINCIPLE-02"
    principle: "점수보다 근거를 먼저 이해하게 한다."
    application: "점수 옆에 거리, 날씨, 대기질, 사용자 적합도 중 실제로 적용된 이유를 함께 표시한다."
  - id: "UX-PRINCIPLE-03"
    principle: "지도와 목록을 하나의 결과로 연결한다."
    application: "추천 카드의 순위, 색상, 시설명이 지도 마커와 일치하도록 만든다."
  - id: "UX-PRINCIPLE-04"
    principle: "의료 서비스로 오해하지 않도록 범위를 분명히 한다."
    application: "접근성 비교 서비스라는 점과 실제 진료 가능 여부를 보장하지 않는다는 안내를 결과 주변에 표시한다."

information_architecture:
  navigation:
    type: "상단 탭 또는 사이드바 메뉴"
    items:
      - id: "recommendation"
        label: "의료기관 추천"
        purpose: "조건 입력, 추천 TOP 5, 지도 확인"
      - id: "regional_analysis"
        label: "지역 의료 현황"
        purpose: "의료기관 수와 인구 대비 접근성 지표 확인"
      - id: "methodology"
        label: "추천 기준 안내"
        purpose: "점수 산식, 데이터 출처, 서비스 한계 확인"
  common_layout:
    - "서비스 이름과 핵심 설명"
    - "주요 화면 이동 메뉴"
    - "현재 선택 조건 요약"
    - "화면별 핵심 콘텐츠"
    - "데이터 출처와 서비스 안내"

screen_composition:
  recommendation_screen:
    purpose: "조건을 선택하고 추천 결과와 근거를 확인한다."
    sections:
      - id: "REC-SECTION-01"
        name: "서비스 소개"
        content:
          - "오늘의 환경과 사용자 특성을 반영해 이동 부담이 낮은 의료기관을 추천한다는 한 줄 설명"
          - "접근성 비교 서비스임을 알리는 짧은 보조 문구"
      - id: "REC-SECTION-02"
        name: "검색 조건"
        content:
          - "대상 지역 선택"
          - "기준 위치 선택 또는 좌표 입력"
          - "사용자 유형 선택"
          - "병원 또는 약국 선택"
          - "추천 실행 버튼"
        behavior:
          - "필수 조건이 없으면 실행 버튼을 비활성화하거나 누락 항목을 안내한다."
          - "선택한 조건을 결과 영역 상단에 요약한다."
      - id: "REC-SECTION-03"
        name: "환경 상태"
        content:
          - "날씨 상태"
          - "기온"
          - "강수 여부"
          - "PM10"
          - "PM2.5"
          - "대기질 등급"
        behavior:
          - "수치와 함께 좋음, 보통, 나쁨 등의 텍스트 등급을 표시한다."
          - "추천에 불리한 조건을 색상과 아이콘으로 강조한다."
      - id: "REC-SECTION-04"
        name: "추천 요약"
        content:
          - "검색된 시설 수"
          - "추천 결과 수"
          - "가장 높은 접근성 점수"
          - "결과에 가장 크게 작용한 조건"
      - id: "REC-SECTION-05"
        name: "추천 TOP 5"
        content:
          - "순위와 시설명"
          - "최종 접근성 점수"
          - "거리"
          - "시설 유형과 진료과목"
          - "주소와 연락처"
          - "추천 이유 2~3개"
          - "점수 구성 요소"
        behavior:
          - "첫 번째 결과를 시각적으로 강조한다."
          - "카드를 선택하면 대응하는 지도 마커를 강조한다."
          - "점수 상세 보기를 열면 구성 점수와 가중치를 표시한다."
      - id: "REC-SECTION-06"
        name: "추천 지도"
        content:
          - "기준 위치 마커"
          - "추천 시설 순위 마커"
          - "시설명, 점수, 거리, 주소 팝업"
        behavior:
          - "마커를 선택하면 대응하는 추천 카드를 강조한다."
          - "모든 추천 시설이 보이도록 지도 범위를 조정한다."
      - id: "REC-SECTION-07"
        name: "결과 안내"
        content:
          - "데이터 출처"
          - "추천에 적용한 데이터 기준"
          - "직선거리 사용 안내"
          - "진료 및 운영 여부 확인 안내"

  regional_analysis_screen:
    purpose: "개별 추천을 넘어 지역의 의료 접근성 특징을 설명한다."
    sections:
      - id: "REGION-SECTION-01"
        name: "지역 요약"
        content:
          - "전체 인구"
          - "고령 인구"
          - "병원 수"
          - "약국 수"
      - id: "REGION-SECTION-02"
        name: "의료기관 구성"
        content:
          - "병원과 약국 수 비교 차트"
          - "시설 유형별 비율"
      - id: "REGION-SECTION-03"
        name: "인구 대비 접근성"
        content:
          - "인구 1만 명당 병원 수"
          - "인구 1만 명당 약국 수"
          - "병원 1곳당 고령 인구"
      - id: "REGION-SECTION-04"
        name: "핵심 해석"
        content:
          - "차트에서 확인되는 특징을 한 문장으로 요약"
          - "수치만으로 판단할 수 없는 한계 안내"

  methodology_screen:
    purpose: "추천 결과의 계산 방식과 데이터 범위를 투명하게 설명한다."
    sections:
      - id: "METHOD-SECTION-01"
        name: "추천 점수 구성"
        content:
          - "거리, 날씨, 대기질, 사용자 적합도 가중치"
          - "각 구성 요소의 점수 구간"
      - id: "METHOD-SECTION-02"
        name: "추천 처리 흐름"
        content:
          - "조건 입력"
          - "시설 거리 계산"
          - "구성 요소 점수 계산"
          - "가중합과 정렬"
          - "추천 이유 생성"
      - id: "METHOD-SECTION-03"
        name: "데이터 안내"
        content:
          - "데이터 종류와 출처"
          - "활용 컬럼"
          - "정제 및 결측값 처리 방식"
      - id: "METHOD-SECTION-04"
        name: "서비스 한계"
        content:
          - "직선거리와 실제 이동 경로의 차이"
          - "운영 여부와 진료 가능 여부를 보장하지 않음"
          - "규칙 기반 가중치의 한계"
          - "교통과 보행 환경이 반영되지 않음"

design_system:
  visual_direction:
    keywords: ["신뢰감", "명료함", "생활 밀착", "차분함"]
    style: "의료 서비스의 신뢰감을 유지하되 과도하게 전문적인 인상을 피하고 공공 생활 서비스처럼 표현한다."
  colors:
    primary:
      usage: "주요 버튼, 선택 상태, 핵심 제목"
      suggestion: "청록 또는 파랑 계열"
    success:
      usage: "좋음 등급, 높은 접근성"
      suggestion: "초록 계열"
    warning:
      usage: "보통 또는 주의가 필요한 상태"
      suggestion: "노랑 또는 주황 계열"
    danger:
      usage: "나쁨 등급, 데이터 오류"
      suggestion: "빨강 계열"
    neutral:
      usage: "배경, 구분선, 보조 텍스트"
      suggestion: "흰색과 회색 계열"
    rules:
      - "색상만으로 상태를 구분하지 않고 텍스트 등급과 아이콘을 함께 사용한다."
      - "추천 순위 색상과 대기질 등급 색상이 혼동되지 않도록 표현 체계를 분리한다."
  typography:
    hierarchy:
      - "페이지 제목"
      - "영역 제목"
      - "핵심 수치와 시설명"
      - "본문"
      - "보조 설명"
    rules:
      - "핵심 수치와 추천 시설명은 본문보다 크게 표시한다."
      - "긴 설명은 문단보다 짧은 문장과 목록으로 나눈다."
      - "작은 화면에서도 안내 문구를 읽을 수 있는 최소 글자 크기를 유지한다."
  components:
    - name: "조건 선택 필드"
      states: ["기본", "선택", "오류", "비활성화"]
    - name: "주요 실행 버튼"
      states: ["기본", "마우스 오버", "실행 중", "비활성화"]
    - name: "환경 상태 카드"
      states: ["좋음", "보통", "나쁨", "데이터 없음"]
    - name: "추천 결과 카드"
      states: ["기본", "1순위", "선택", "지도와 연동"]
    - name: "지도 마커"
      states: ["기준 위치", "추천 순위", "선택"]
    - name: "안내 메시지"
      states: ["정보", "주의", "오류", "성공"]

functional_interactions:
  - id: "INTERACTION-01"
    trigger: "추천 실행"
    processing:
      - "입력값을 검증한다."
      - "조건에 맞는 시설을 필터링한다."
      - "거리와 구성 점수를 계산한다."
      - "TOP 5와 추천 이유를 생성한다."
    feedback:
      - "처리 중 상태를 표시한다."
      - "완료 후 결과 영역으로 시선을 유도한다."
  - id: "INTERACTION-02"
    trigger: "추천 카드 선택"
    processing:
      - "선택한 시설 정보를 활성 상태로 저장한다."
    feedback:
      - "카드를 강조한다."
      - "대응하는 지도 마커와 팝업을 강조한다."
  - id: "INTERACTION-03"
    trigger: "지도 마커 선택"
    processing:
      - "선택한 시설을 추천 목록에서 찾는다."
    feedback:
      - "대응하는 추천 카드를 강조한다."
      - "시설의 핵심 정보를 팝업에 표시한다."
  - id: "INTERACTION-04"
    trigger: "점수 상세 보기"
    processing:
      - "거리, 날씨, 대기질, 사용자 적합도 점수를 불러온다."
    feedback:
      - "구성 점수, 가중치, 최종 점수의 관계를 펼침 영역에 표시한다."
  - id: "INTERACTION-05"
    trigger: "검색 조건 변경"
    processing:
      - "기존 결과가 변경 전 조건의 결과인지 판별한다."
    feedback:
      - "다시 추천을 실행하도록 안내하거나 자동으로 결과를 갱신한다."

state_handling:
  initial:
    display: "검색 조건과 서비스 사용 방법을 표시하고 결과 영역에는 안내 예시를 제공한다."
  loading:
    display: "추천 계산 중임을 표시하고 중복 실행을 방지한다."
  success:
    display: "조건 요약, TOP 5, 지도, 추천 이유를 표시한다."
  empty:
    display: "검색 결과가 없음을 알리고 지역 또는 시설 유형 변경 방법을 안내한다."
  partial_data:
    display: "누락된 항목을 정보 없음으로 표시하고 추정값처럼 표현하지 않는다."
  data_error:
    display: "오류 내용을 간단히 안내하고 저장된 대체 데이터 사용 여부를 표시한다."
  calculation_error:
    display: "추천 계산을 완료하지 못했음을 안내하고 입력 조건을 유지한 채 다시 실행할 수 있게 한다."

responsive_design:
  desktop:
    layout:
      - "검색 조건과 환경 상태를 가로 영역으로 배치한다."
      - "추천 카드와 지도를 나란히 배치한다."
      - "지역 분석 차트를 여러 열로 배치한다."
  narrow_screen:
    layout:
      - "검색 조건을 세로로 배치한다."
      - "추천 카드를 지도보다 먼저 표시한다."
      - "차트와 표가 가로로 잘리지 않도록 한 열로 배치한다."
  rules:
    - "핵심 기능이 화면 너비에 따라 사라지지 않도록 한다."
    - "가로 스크롤이 필요한 표는 핵심 컬럼을 우선 노출한다."
    - "지도 높이가 지나치게 작아지지 않도록 최소 높이를 지정한다."

accessibility:
  tasks:
    - "모든 입력 필드에 명확한 라벨과 도움말을 제공한다."
    - "키보드만으로 주요 입력과 실행 버튼에 접근할 수 있게 한다."
    - "색상 외에 텍스트, 아이콘, 순위 번호로 상태를 표현한다."
    - "본문과 배경, 버튼과 버튼 텍스트 사이에 충분한 명도 대비를 확보한다."
    - "차트의 의미를 제목, 단위, 범례, 요약 문장으로 함께 제공한다."
    - "오류 메시지에 문제 원인과 사용자가 수행할 수 있는 해결 행동을 포함한다."

content_writing:
  tone: "쉽고 단정하며 과장하지 않는 안내 문체"
  rules:
    - "의학적 진단이나 치료 적합성을 보장하는 표현을 사용하지 않는다."
    - "전문 용어를 사용할 때는 사용자가 이해할 수 있는 설명을 덧붙인다."
    - "추천 이유는 데이터와 규칙으로 확인 가능한 사실만 사용한다."
    - "버튼 문구는 수행 결과가 분명한 동사형으로 작성한다."
  examples:
    primary_action: "추천 결과 보기"
    empty_result: "조건에 맞는 의료기관을 찾지 못했습니다. 지역 또는 시설 유형을 변경해 보세요."
    missing_data: "진료과목 정보가 제공되지 않은 시설입니다."
    service_limit: "이 결과는 이동 접근성 비교를 위한 참고 정보이며 진료 가능 여부를 보장하지 않습니다."

implementation_tasks:
  - id: "DESIGN-01"
    task: "세 화면의 정보 구조와 화면 이동 방식을 확정한다."
    output: "화면 구조 목록과 내비게이션 정의"
    done_when: "모든 콘텐츠가 중복 없이 하나의 화면 또는 공통 영역에 배정되어 있다."
  - id: "DESIGN-02"
    task: "추천 화면의 섹션 순서와 핵심 정보 우선순위를 정한다."
    output: "추천 화면 와이어프레임"
    done_when: "검색 조건, 환경 상태, TOP 5, 지도, 안내의 위치가 정의되어 있다."
  - id: "DESIGN-03"
    task: "지역 분석 화면과 추천 기준 안내 화면의 콘텐츠를 배치한다."
    output: "분석 및 방법론 화면 와이어프레임"
    done_when: "각 차트와 설명 항목의 목적이 명확히 연결되어 있다."
  - id: "DESIGN-04"
    task: "색상, 글자, 간격, 카드, 버튼, 상태 메시지 규칙을 정의한다."
    output: "디자인 토큰과 공통 컴포넌트 규칙"
    done_when: "같은 의미의 요소가 모든 화면에서 동일하게 표현된다."
  - id: "DESIGN-05"
    task: "추천 카드와 지도 사이의 양방향 선택 동작을 구현한다."
    output: "연동되는 추천 목록과 지도"
    done_when: "카드 또는 마커를 선택했을 때 양쪽에서 같은 시설이 강조된다."
  - id: "DESIGN-06"
    task: "초기, 로딩, 성공, 결과 없음, 일부 데이터 누락, 오류 상태를 구현한다."
    output: "상태별 화면과 안내 문구"
    done_when: "각 상태를 강제로 발생시켜도 화면이 중단되지 않고 다음 행동을 안내한다."
  - id: "DESIGN-07"
    task: "넓은 화면과 좁은 화면의 배치를 조정한다."
    output: "반응형 레이아웃"
    done_when: "핵심 정보가 잘리거나 겹치지 않고 우선순위에 따라 표시된다."
  - id: "DESIGN-08"
    task: "라벨, 키보드 접근, 색상 대비, 차트 설명을 점검한다."
    output: "접근성 점검 결과"
    done_when: "색상 없이도 상태와 순위를 구분하고 주요 기능을 키보드로 사용할 수 있다."
  - id: "DESIGN-09"
    task: "화면 문구와 서비스 한계 안내를 검토한다."
    output: "확정된 UI 문구"
    done_when: "과장되거나 의료적 판단으로 오해될 표현이 없고 모든 오류 안내에 해결 행동이 포함된다."
  - id: "DESIGN-10"
    task: "대표 시나리오로 전체 사용자 흐름을 검증하고 불필요한 단계와 정보를 줄인다."
    output: "사용성 검증 결과와 수정 목록"
    done_when: "별도 설명 없이 조건 선택, 추천 실행, 결과 근거, 지도 위치를 확인할 수 있다."

design_acceptance_criteria:
  - "서비스의 핵심 목적과 추천 실행 방법을 첫 화면에서 이해할 수 있다."
  - "추천 TOP 5, 점수, 추천 이유, 지도 위치가 하나의 결과로 인식된다."
  - "사용자는 최종 점수의 구성 요소와 적용 규칙을 확인할 수 있다."
  - "데이터 누락과 오류가 발생해도 화면이 중단되지 않고 해결 행동을 안내한다."
  - "넓은 화면과 좁은 화면에서 핵심 정보가 잘리거나 겹치지 않는다."
  - "색상에 의존하지 않고 상태, 순위, 등급을 구분할 수 있다."
  - "서비스가 의료적 판단이 아닌 이동 접근성 참고 도구임을 명확히 전달한다."
