stage: "분석과 설명 자료 구성"
goal: "지역 지표를 계산하고 문제, 해결 방식, 결과, 한계를 일관된 자료로 구성한다."

analysis_metrics:
  hospital_per_10000: "병원 수 / 인구 수 × 10000"
  pharmacy_per_10000: "약국 수 / 인구 수 × 10000"
  elderly_per_hospital: "고령 인구 수 / 병원 수"

content_tasks:
  - order: 1
    title: "문제 제기"
    message: "병원이 가까워도 비가 오거나 미세먼지가 심하면 실제 방문은 더 어려울 수 있습니다."
    visual: "거리만 보여주는 기존 검색 예시와 날씨·대기질 아이콘"
  - order: 2
    title: "프로젝트 질문"
    message: "오늘의 환경과 사용자의 특성까지 고려하면 어떤 의료기관이 더 가기 좋을까요?"
    visual: "거리+날씨+대기질+사용자 유형 결합 그림"
  - order: 3
    title: "사용 데이터"
    message: "서로 다른 네 종류의 공공데이터를 하나의 지역과 좌표 기준으로 결합했습니다."
    visual: "병원·약국, 기상청, AirKorea, KOSIS 데이터 흐름"
  - order: 4
    title: "추천 방식"
    message: "거리 45%, 날씨 20%, 대기질 20%, 사용자 적합도 15%로 이해 가능한 점수를 만들었습니다."
    visual: "가중치 막대 또는 도넛 차트"
  - order: 5
    title: "서비스 결과 비교"
    message: "사용자와 상황을 바꾸면 추천 순위와 이유도 함께 달라집니다."
    visual: "일반 사용자와 취약 사용자 결과 비교"
  - order: 6
    title: "지역 분석"
    message: "개인 추천을 넘어 우리 지역의 의료 인프라 부족도 확인할 수 있습니다."
    visual: "인구 1만 명당 시설 수 차트"
  - order: 7
    title: "결론"
    message: "공공데이터를 결합하면 단순 위치 정보를 상황 기반 의사결정 정보로 바꿀 수 있습니다."
    visual: "핵심 결과 화면과 한 줄 메시지"

demo_scenarios:
  - name: "기본 추천"
    setting: "일반 사용자 + 맑음 + 대기질 보통"
    speaking_point: "기본적으로 거리가 가까운 시설이 우선됩니다."
  - name: "고령자 이동 부담"
    setting: "고령자 + 비"
    speaking_point: "날씨와 짧은 이동거리를 함께 고려해 추천 결과가 달라집니다."
  - name: "호흡기 민감 상황"
    setting: "호흡기 질환자 + 미세먼지 나쁨"
    speaking_point: "대기질, 거리, 관련 진료과목을 함께 반영합니다."

expected_questions:
  - question: "가중치에 근거가 있나요?"
    answer: "이번 결과는 수업용 규칙 기반 프로토타입입니다. 거리의 영향을 가장 크게 두고 대표 시나리오로 방향성을 검증했습니다."
  - question: "실제 길찾기 거리인가요?"
    answer: "현재 버전은 좌표 간 직선거리를 사용합니다. 따라서 접근성 참고용이며 실제 경로와 차이가 있을 수 있습니다."
  - question: "추천 결과를 믿을 수 있나요?"
    answer: "의료적 적합성을 판단하는 서비스가 아니라 공공데이터 기반 이동 접근성 비교 서비스입니다. 데이터 출처와 적용 기준을 함께 제공합니다."
  - question: "왜 교통 데이터가 없나요?"
    answer: "핵심 결합과 추천 기능의 범위를 명확히 하기 위해 거리·날씨·대기질에 집중했습니다."

done_when:
  - "모든 설명 자료가 핵심 질문에 답하는 데 기여한다."
  - "기능 설명과 결과 해석이 같은 핵심 메시지로 연결된다."
  - "한계점을 숨기지 않고 현재 구현 범위를 정확히 말한다."
