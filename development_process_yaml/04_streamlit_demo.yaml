stage: "Streamlit 화면 구현"
goal: "입력, 추천 결과, 근거, 지역 분석을 한 흐름에서 확인할 수 있는 화면을 만든다."

screen_flow:
  - step: 1
    action: "지역·사용자 유형·병원/약국을 선택한다."
  - step: 2
    action: "적용할 날씨와 대기질을 확인한다."
  - step: 3
    action: "추천 실행 버튼을 누른다."
  - step: 4
    action: "TOP 5, 점수, 이유, 지도를 확인한다."
  - step: 5
    action: "지역 의료 현황 차트로 프로젝트 의미를 확인한다."

page_1_recommendation:
  title: "오늘 가기 좋은 병원·약국 찾기"
  inputs: ["지역", "사용자 유형", "병원 또는 약국", "기준 위치"]
  status_cards: ["날씨", "기온", "PM10", "PM2.5"]
  result_card:
    fields: ["순위", "시설명", "접근성 점수", "거리", "진료과목", "주소", "추천 이유"]
  map:
    markers: ["기준 위치", "추천 병원", "추천 약국"]
    popup: ["시설명", "점수", "거리", "주소"]

page_2_regional_analysis:
  title: "우리 지역의 의료 접근성은 어떤가요?"
  charts:
    - "병원과 약국 수"
    - "인구 1만 명당 병원·약국 수"
    - "고령 인구 대비 병원 수"
  insight_example: "이 지역은 고령 인구 비율에 비해 병원 수가 적어 고령층의 의료 접근 부담이 클 수 있습니다."

visual_rules:
  - "가장 중요한 추천 결과를 화면 위쪽에 배치한다."
  - "점수 옆에 반드시 추천 이유를 표시한다."
  - "초록·노랑·주황·빨강 색상과 텍스트 등급을 함께 사용한다."
  - "차트 제목에 단위와 집계 기준을 표시한다."
  - "화면 하단에 데이터 출처, 데이터 기준, 서비스 한계를 표시한다."

states_to_handle:
  no_result: "검색 범위를 변경하거나 다른 시설 유형을 선택하도록 안내"
  data_error: "저장된 대체 데이터를 사용 중이라고 안내"
  missing_specialty: "진료과목 정보 없음으로 표시하고 임의로 추정하지 않음"

service_notice: "본 결과는 공공데이터를 활용한 접근성 참고 정보이며 의료적 진단이나 실제 운영 여부를 보장하지 않습니다. 방문 전 해당 기관에 확인하세요."

done_when:
  - "처음 보는 사람이 별도 설명 없이 검색 조건과 TOP 5를 이해한다."
  - "추천 카드와 지도 순위가 일치한다."
  - "목표 화면 해상도에서 글자와 차트가 잘리지 않는다."
  - "저장된 데이터만으로 전체 시연이 가능하다."
