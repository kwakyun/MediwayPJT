stage: "통합 작업 목록"
goal: "의존 관계에 따라 구현 작업을 완료하고 각 단계의 결과를 검증한다."

task_groups:
  - id: "PLAN-01"
    name: "범위와 사용 시나리오 정의"
    tasks:
      - "대상 지역 1곳을 선정한다."
      - "일반, 고령자, 호흡기 질환자 시나리오를 정의한다."
      - "검색부터 추천 결과 확인까지의 화면 흐름을 정한다."
    outputs:
      - "대상 지역 정의"
      - "대표 시나리오 3종"
      - "화면 흐름"
    done_when: "모든 시나리오의 입력값, 기대 결과, 확인 항목이 문서화되어 있다."

  - id: "PLAN-02"
    name: "데이터 준비"
    depends_on: ["PLAN-01"]
    tasks:
      - "병원·약국, 날씨, 대기질, 인구 데이터를 수집한다."
      - "추천과 시각화에 필요한 컬럼만 남기고 데이터 형식을 통일한다."
      - "주소, 좌표, 시설 유형, 결측값, 중복값을 검증한다."
      - "앱에서 읽을 processed CSV와 데이터 출처 문서를 만든다."
    outputs:
      - "정제된 CSV 4종"
      - "데이터 출처 및 컬럼 설명"
    done_when: "앱이 모든 CSV를 오류 없이 읽고 시설을 올바른 지도 위치에 표시한다."

  - id: "PLAN-03"
    name: "추천 모델 구현"
    depends_on: ["PLAN-02"]
    tasks:
      - "사용자 위치와 시설 사이의 거리를 계산한다."
      - "거리, 날씨, 대기질, 사용자 적합도를 각각 점수화한다."
      - "가중합으로 최종 점수를 계산하고 TOP 5를 선택한다."
      - "점수 조건에 맞는 추천 이유를 생성한다."
    outputs:
      - "추천 점수 계산 함수"
      - "추천 이유 생성 규칙"
      - "TOP 5 결과"
    done_when: "입력 조건을 바꾸면 정의된 규칙에 따라 순위와 추천 이유가 함께 달라진다."

  - id: "PLAN-04"
    name: "Streamlit 화면 구현"
    depends_on: ["PLAN-02", "PLAN-03"]
    tasks:
      - "검색 조건 입력 영역을 만든다."
      - "날씨와 대기질 상태 카드를 만든다."
      - "추천 TOP 5 카드와 지도 마커를 연결한다."
      - "지역 의료 현황 차트와 서비스 안내를 추가한다."
      - "검색 결과 없음, 데이터 오류, 진료과목 누락 상태를 처리한다."
    outputs:
      - "추천 화면"
      - "지역 분석 화면"
      - "예외 상태 안내"
    done_when: "검색 입력부터 결과, 지도, 차트 확인까지 한 흐름으로 작동한다."

  - id: "PLAN-05"
    name: "분석과 설명 자료 구성"
    depends_on: ["PLAN-02", "PLAN-03", "PLAN-04"]
    tasks:
      - "인구 대비 의료기관 지표를 계산한다."
      - "프로젝트 문제, 데이터, 추천 방식, 결과, 한계를 설명하는 자료를 만든다."
      - "대표 시나리오별 입력값과 설명 포인트를 정리한다."
      - "예상 질문과 답변을 준비한다."
    outputs:
      - "지역 의료 접근성 지표"
      - "발표 자료와 설명문"
      - "시연 입력값 및 예상 질의응답"
    done_when: "각 화면과 차트가 프로젝트의 핵심 질문과 결론을 뒷받침한다."

  - id: "PLAN-06"
    name: "통합 검증과 실행 패키지 구성"
    depends_on: ["PLAN-04", "PLAN-05"]
    tasks:
      - "기능, 점수, 지도, 차트의 결과를 교차 검증한다."
      - "대표 시나리오 3종을 전체 흐름으로 실행한다."
      - "저장된 데이터만 사용하는 실행 경로를 확인한다."
      - "앱, 데이터, 발표 자료, 시연 영상을 하나의 패키지로 정리한다."
    outputs:
      - "검증 결과"
      - "오프라인 실행 패키지"
      - "장애 대응용 시연 영상"
    done_when: "핵심 시나리오와 오프라인 실행 경로가 모두 오류 없이 작동한다."

execution_rules:
  - "새 기능을 추가하기 전에 핵심 검색·추천 흐름이 정상 작동하는지 확인한다."
  - "각 작업은 산출물과 완료 조건을 함께 검증한다."
  - "데이터나 점수 규칙을 변경하면 추천 결과, 지도, 차트, 설명 자료를 함께 갱신한다."
